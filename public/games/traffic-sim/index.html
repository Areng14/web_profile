<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/games/traffic-sim/">
<title>Traffic Sim</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a24; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; background: #141a24; }

  /* Loading screen, styled like the game's own panels (Night Shift palette) */
  #loader {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #141a24; color: #eef2f9; font: 500 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: opacity .45s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { font-weight: 500; color: #8f9ab0; }
  .bar { width: min(320px, 70vw); height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: #5b8cff; transition: width .2s ease; }
  #status { color: #8f9ab0; font-size: 13px; }

  #note {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100vw - 32px); display: none;
    padding: 8px 14px; border-radius: 999px; background: rgba(20, 26, 38, 0.92); color: #c2cad9;
    font: 500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>

<div id="loader" role="status" aria-live="polite">
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a83ec"/><stop offset=".55" stop-color="#2d6cdf"/><stop offset="1" stop-color="#2459bd"/></linearGradient></defs>
      <rect width="24" height="24" rx="7.2" fill="url(#g)"/>
      <path d="M6 8.4V14a3.6 3.6 0 0 0 3.6 3.6H15.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="6" cy="6" r="2.4" fill="#fff"/><circle cx="18" cy="18" r="2.4" fill="#fff"/>
    </svg>
    City<span>Planning</span>
  </div>
  <div class="bar"><i id="fill"></i></div>
  <div id="status">Loading the city…</div>
</div>

<div id="note">Best on a computer: it's played with a mouse and keyboard.</div>

<script>
  // Unity WebGL build (gzip with decompression fallback, so no server headers are needed).
  var canvas = document.getElementById("canvas");
  var fill = document.getElementById("fill");
  var statusEl = document.getElementById("status");

  // Touch-only devices get a heads-up; the game has no touch controls.
  if (matchMedia("(pointer: coarse)").matches && !matchMedia("(pointer: fine)").matches)
    document.getElementById("note").style.display = "block";

  var config = {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "Traffic Sim",
    productVersion: "0.1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2), // cap the fill rate on high-DPI screens
  };

  var script = document.createElement("script");
  script.src = "Build/WebGL.loader.js";
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      fill.style.width = Math.round(progress * 100) + "%";
    }).then(function () {
      document.getElementById("loader").classList.add("done");
      canvas.focus();
    }).catch(function (err) {
      statusEl.textContent = "The game couldn't start: " + err;
    });
  };
  script.onerror = function () { statusEl.textContent = "The game files didn't load. Try refreshing."; };
  document.body.appendChild(script);
</script>
</body>
</html>
